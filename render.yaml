services:
  - type: web
    name: dashboard-followup
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: REQUIRE_AUTH
        value: "1"
      - key: DASHBOARD_DB_PATH
        value: /app/data/dashboard.sqlite
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
