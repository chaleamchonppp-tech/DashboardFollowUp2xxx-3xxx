services:
  - type: web
    name: dashboard-followup
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: sap-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: REQUIRE_AUTH
        value: "1"
      - key: DASHBOARD_DB_PATH
        value: /var/data/dashboard.sqlite
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
